<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Praticables</title>
<link rel="apple-touch-icon" href="icone.jpg">

<style>
body{
font-family:-apple-system,Arial;
margin:0;
padding:12px;
background:linear-gradient(180deg,#6a5acd,#c056d5);
}

.header{
text-align:center;
color:white;
margin-bottom:10px;
}

.header h1{margin:0;font-size:28px;}
.header p{margin:0;font-size:16px;}

.card{
background:white;
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

input,select{
padding:6px;
border-radius:8px;
border:2px solid #7b5cff;
margin:4px;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
margin-top:8px;
color:white;
}

.add{background:#7b5cff;}
.reset{background:#d84343;}

.module{
border:2px solid #ddd;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.small{color:#666;font-size:13px;}

.plan{
margin-top:10px;
}

.modulePlan{
margin-bottom:10px;
}

.grid{
display:grid;
gap:2px;
}

.cell{
height:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
background:#eee;
}

.cell.r{
background:#7b5cff;
color:white;
}
</style>
</head>

<body>

<div class="header">
<h1 id="headerArtist">—</h1>
<p id="headerDate">—</p>
</div>

<div class="card">
Artiste <input id="artiste">
Date <input id="date" type="date">
</div>

<div class="card">
<div id="modules"></div>
<button class="add" onclick="addModule()">+ Ajouter module</button>
<button class="reset" onclick="resetAll()">Reset</button>
</div>

<div class="card">
<h3>Total</h3>
<div id="total"></div>
</div>

<div class="card">
<h3>Plan</h3>
<div id="plan"></div>
</div>

<script>

let modules = []

let modulesDiv, planDiv, totalDiv
let artisteInput, dateInput, headerArtist, headerDate

function formatDateFR(dateStr){
if(!dateStr) return "—"
let d = new Date(dateStr)
return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})
}

function save(){
localStorage.setItem("modules",JSON.stringify(modules))
localStorage.setItem("artiste",artisteInput.value)
localStorage.setItem("date",dateInput.value)
}

function load(){
modules = JSON.parse(localStorage.getItem("modules")||"[]")
artisteInput.value = localStorage.getItem("artiste")||""
dateInput.value = localStorage.getItem("date")||""
render()
}

function addModule(){
modules.push({L:4,P:2,H:40,R:false})
render()
save()
}

function update(i,key,val){
modules[i][key] = (key==="R")?val:(parseFloat(val)||0)
render()
save()
}

function removeModule(i){
modules.splice(i,1)
render()
save()
}

function calc(m){

let cols = Math.ceil(m.L / 2) // 2m côté
let rows = Math.ceil(m.P / 1) // 1m côté

let praticables = cols * rows
let risers = m.R ? praticables : 0

let contacts = (cols-1)*rows + cols*(rows-1)
let sucres = contacts * 2

return {cols,rows,praticables,risers,sucres}
}

function render(){

headerArtist.innerText = artisteInput.value || "—"
headerDate.innerText = formatDateFR(dateInput.value)

let html=""
let totalP=0,totalR=0,totalS=0

modules.forEach((m,i)=>{

let c=calc(m)

totalP+=c.praticables
totalR+=c.risers
totalS+=c.sucres

html+=`
<div class="module">

<b>${m.L}×${m.P} à ${m.H} cm ${m.R?"(R)":""}</b><br>

Praticables : ${c.praticables}<br>
Risers : ${c.risers}<br>
<span class="small">Sucres : ${c.sucres}</span><br><br>

L <input type="number" value="${m.L}" onchange="update(${i},'L',this.value)">
P <input type="number" value="${m.P}" onchange="update(${i},'P',this.value)">
H <input type="number" value="${m.H}" onchange="update(${i},'H',this.value)">

<select onchange="update(${i},'R',this.value==='true')">
<option value="false" ${!m.R?"selected":""}>Sans Riser</option>
<option value="true" ${m.R?"selected":""}>Sur Riser</option>
</select>

<button onclick="removeModule(${i})">Supprimer</button>

</div>`
})

modulesDiv.innerHTML = html

totalDiv.innerHTML = `
Praticables : ${totalP}<br>
Risers : ${totalR}<br>
<span class="small">Sucres : ${totalS}</span>
`

drawPlan()
}

function drawPlan(){

planDiv.innerHTML=""

modules.forEach(m=>{

let c=calc(m)

let wrapper=document.createElement("div")
wrapper.className="modulePlan"

let grid=document.createElement("div")
grid.className="grid"

// IMPORTANT : respect 2m horizontal / 1m vertical
grid.style.gridTemplateColumns=`repeat(${c.cols},40px)`

for(let y=0;y<c.rows;y++){
for(let x=0;x<c.cols;x++){

let cell=document.createElement("div")
cell.className="cell"
cell.style.width="40px"  // 2m
cell.style.height="20px" // 1m

if(m.R){
cell.classList.add("r")
cell.innerText="R"
}

grid.appendChild(cell)
}
}

wrapper.appendChild(grid)
planDiv.appendChild(wrapper)

})
}

function resetAll(){
modules=[]
localStorage.clear()
render()
}

document.addEventListener("input",save)

document.addEventListener("DOMContentLoaded",()=>{

modulesDiv=document.getElementById("modules")
planDiv=document.getElementById("plan")
totalDiv=document.getElementById("total")
artisteInput=document.getElementById("artiste")
dateInput=document.getElementById("date")
headerArtist=document.getElementById("headerArtist")
headerDate=document.getElementById("headerDate")

load()

})

</script>

</body>
</html>
