<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Praticables</title>

<style>
body{
font-family:-apple-system,Arial;
margin:0;
padding:12px;
background:#f5f5f5;
}

.header{
text-align:center;
margin-bottom:10px;
}

.card{
background:white;
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

input,select{
width:100%;
padding:8px;
margin-top:6px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
margin-top:6px;
background:#6a5acd;
color:white;
}

.reset{
background:#d84343;
}

.module{
border:2px solid #ddd;
padding:10px;
border-radius:10px;
margin-bottom:12px;
}

.grid{
display:grid;
gap:2px;
margin-top:6px;
}

.cell{
width:30px;
height:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
background:#ddd;
}

.riser{
background:#6a5acd;
color:white;
}

.globalPlan{
display:flex;
flex-wrap:wrap;
gap:20px;
}

.commande{
font-size:22px;
font-weight:bold;
}

.sucres{
font-size:12px;
opacity:0.5;
}
</style>
</head>

<body>

<div class="header">
<h2 id="title">—</h2>
</div>

<div class="card">
<input id="artiste" placeholder="Artiste">
<input id="date" type="date">
</div>

<div class="card">
<button onclick="addModule()">+ Ajouter module</button>
<button class="reset" onclick="resetAll()">Reset</button>
</div>

<div id="modules"></div>

<div class="card">
<h3>COMMANDE</h3>
<div id="total"></div>
</div>

<div class="card">
<h3>Plan global</h3>
<div id="plan" class="globalPlan"></div>
</div>

<script>

let modules=[]

function save(){
localStorage.setItem("modules",JSON.stringify(modules))
localStorage.setItem("artiste",artiste.value)
localStorage.setItem("date",date.value)
}

function load(){
modules=JSON.parse(localStorage.getItem("modules")||"[]")
artiste.value=localStorage.getItem("artiste")||""
date.value=localStorage.getItem("date")||""
render()
}

function calc(m){
let L=Math.ceil((m.L||0)/2)
let P=Math.ceil((m.P||0))
let praticables=L*P
let risers=m.R?praticables:0
let sucres=((L-1)*P + L*(P-1))*2
return {L,P,praticables,risers,sucres}
}

function addModule(){
modules.push({
L:"",
P:"",
H:"",
R:false,
validated:false
})
render()
}

function validateModule(i){
modules[i].validated=true
save()
render()
}

function update(i,key,val){
modules[i][key]=(key==="R")?val:val
render()
}

function removeModule(i){
modules.splice(i,1)
save()
render()
}

function render(){

title.innerText = artiste.value || "—"

let html=""
let totalP=0,totalR=0,totalS=0

modules.forEach((m,i)=>{

let c=calc(m)

if(m.validated){
totalP+=c.praticables
totalR+=c.risers
totalS+=c.sucres
}

html+=`
<div class="module">

${!m.validated ? `

<b>Nouveau module</b>

<input placeholder="Dimension A (m)" value="${m.L}" onchange="update(${i},'L',this.value)">
<input placeholder="Dimension B (m)" value="${m.P}" onchange="update(${i},'P',this.value)">
<input placeholder="Hauteur (cm)" value="${m.H}" onchange="update(${i},'H',this.value)">

<select onchange="update(${i},'R',this.value==='true')">
<option value="false">Sans Riser</option>
<option value="true">Sur Riser</option>
</select>

<button onclick="validateModule(${i})">VALIDER MODULE</button>

` : `

<b>${m.L} × ${m.P} à ${m.H} cm</b>

Praticables : ${c.praticables}<br>
Risers : ${c.risers}<br>
<span class="sucres">Sucres : ${c.sucres}</span>

<div class="grid" style="grid-template-columns:repeat(${c.L},30px)">
${Array(c.L*c.P).fill(0).map(()=>`
<div class="cell ${m.R?"riser":""}">${m.H}</div>
`).join("")}
</div>

<button onclick="removeModule(${i})">Supprimer</button>

`}

</div>
`
})

modulesDiv.innerHTML=html

total.innerHTML=`
<div class="commande">
Praticables : ${totalP}<br>
Risers : ${totalR}
</div>
<div class="sucres">
Sucres : ${totalS}
</div>
`

drawGlobalPlan()
}

function drawGlobalPlan(){

plan.innerHTML=""

modules.forEach(m=>{

if(!m.validated) return

let c=calc(m)

let grid=document.createElement("div")
grid.className="grid"
grid.style.gridTemplateColumns=`repeat(${c.L},30px)`

for(let i=0;i<c.L*c.P;i++){
let cell=document.createElement("div")
cell.className="cell"

if(m.R) cell.classList.add("riser")

cell.innerText=m.H

grid.appendChild(cell)
}

plan.appendChild(grid)

})
}

function resetAll(){
modules=[]
localStorage.clear()
render()
}

document.addEventListener("input",save)

document.addEventListener("DOMContentLoaded",()=>{
modulesDiv=document.getElementById("modules")
plan=document.getElementById("plan")
total=document.getElementById("total")
artiste=document.getElementById("artiste")
date=document.getElementById("date")
title=document.getElementById("title")
load()
})

</script>

</body>
</html>
