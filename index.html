<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plan d’implantation praticables</title>

<link rel="icon" href="flavicon.jpg">
<link rel="apple-touch-icon" href="flavicon.jpg">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

:root{
--bg:#dfe5ec;
--card:#f8fafc;
--text:#1f2937;
--border:#c7d0db;
--accent:#5b4bdb;
--accent2:#7b6cff;
--green:#2ca36b;
--orange:#ff8b3d;
--danger:#d64545;
--module:#cbd5e1;
--moduleRiser:#a5b4d4;
--shadow:0 4px 18px rgba(0,0,0,0.08);
}

.dark{
--bg:#0f172a;
--card:#1e293b;
--text:#f1f5f9;
--border:#334155;
--module:#64748b;
--moduleRiser:#8193b6;
--shadow:0 4px 20px rgba(0,0,0,0.35);
}

*{
box-sizing:border-box;
}

body{
margin:0;
padding:10px;
font-family:-apple-system,Arial,sans-serif;
background:linear-gradient(to bottom,var(--bg),#cfd7e2);
color:var(--text);
overflow-x:hidden;
max-width:100vw;
transition:0.2s;
}

.mainTitle{
text-align:center;
margin-bottom:14px;
padding:14px;
background:var(--card);
border:2px solid var(--border);
border-radius:18px;
box-shadow:var(--shadow);
}

.mainTitle h1{
margin:0;
font-size:28px;
letter-spacing:1px;
}

.mainTitle p{
margin:6px 0 0;
font-size:14px;
opacity:0.8;
}

.card{
background:var(--card);
border:2px solid var(--border);
border-radius:18px;
padding:14px;
margin-bottom:14px;
box-shadow:var(--shadow);
overflow:hidden;
}

.topInputs{
display:flex;
flex-direction:column;
gap:10px;
}

.topInputs input{
width:100%;
padding:12px;
border-radius:12px;
border:2px solid var(--border);
font-size:16px;
background:white;
}

.dark .topInputs input{
background:#0f172a;
color:white;
}

.topBtns{
display:flex;
gap:8px;
width:100%;
}

.topBtns button{
flex:1;
}

button{
border:none;
border-radius:12px;
padding:12px;
font-weight:bold;
cursor:pointer;
transition:0.15s;
color:white;
width:100%;
margin-top:8px;
}

button:hover{
transform:scale(1.01);
}

.primary{
background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.green{
background:var(--green);
}

.orange{
background:var(--orange);
}

.red{
background:var(--danger);
}

.darkBtn{
background:#111827;
}

.module{
border:2px solid var(--border);
border-radius:16px;
padding:14px;
margin-bottom:14px;
background:rgba(255,255,255,0.45);
backdrop-filter:blur(4px);
}

.dark .module{
background:rgba(255,255,255,0.03);
}

.module h3{
margin-top:0;
margin-bottom:10px;
}

.inputs{
display:grid;
grid-template-columns:1fr;
gap:8px;
margin-bottom:10px;
}

.inputs input,
.inputs select{
padding:12px;
border-radius:12px;
border:2px solid var(--border);
font-size:15px;
background:white;
}

.dark .inputs input,
.dark .inputs select{
background:#0f172a;
color:white;
}

.grid{
display:grid;
gap:4px;
margin-top:12px;
}

.cell{
width:58px;
height:28px;
background:linear-gradient(135deg,var(--module),#dbe4ef);
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
font-weight:bold;
font-size:13px;
color:#1e293b;
border:1px solid rgba(255,255,255,0.6);
}

.cell.riser{
background:linear-gradient(135deg,var(--moduleRiser),#c7d5ee);
}

.dark .cell{
color:white;
}

.r{
position:absolute;
left:3px;
bottom:1px;
font-size:8px;
font-weight:bold;
color:#ff3b3b;
}

.planGlobal{
display:flex;
flex-wrap:wrap;
gap:12px;
justify-content:flex-start;
align-items:flex-start;
margin-top:16px;
}

.planBlock{
padding:8px;
border-radius:14px;
border:2px dashed var(--border);
background:rgba(255,255,255,0.18);
transform-origin:top left;
}

.exportHeader{
text-align:center;
margin-bottom:18px;
}

.exportHeader h2{
margin:0 0 10px;
font-size:20px;
letter-spacing:1px;
}

.exportHeader h1{
margin:0;
font-size:28px;
}

.exportHeader p{
margin-top:6px;
font-size:14px;
opacity:0.75;
}

.moduleResume{
margin-top:10px;
padding:12px;
border-radius:12px;
background:rgba(0,0,0,0.04);
font-size:14px;
line-height:1.7;
}

.dark .moduleResume{
background:rgba(255,255,255,0.05);
}

.legend{
margin-top:12px;
font-size:12px;
opacity:0.75;
}

.commande{
margin-top:18px;
padding-top:14px;
border-top:2px solid var(--border);
}

.commande h2{
margin:0 0 12px;
}

.big{
font-size:20px;
font-weight:bold;
line-height:1.6;
}

.small{
font-size:12px;
opacity:0.45;
margin-top:6px;
}

.exportBtns{
display:grid;
gap:10px;
margin-top:16px;
}

@media(max-width:500px){

.cell{
width:44px;
height:22px;
font-size:10px;
}

.planGlobal{
gap:8px;
}

.big{
font-size:17px;
}

.exportHeader h1{
font-size:24px;
}

}

</style>
</head>

<body>

<div class="mainTitle">

<h1 id="artistDisplay">—</h1>

<p id="dateDisplay"></p>

</div>

<div class="card">

<div class="topInputs">

<input id="artistInput" placeholder="Artiste">

<input id="dateInput" type="date">

<div class="topBtns">

<button class="primary" onclick="lockHeader()">✔</button>

<button class="orange" onclick="unlockHeader()">✏️</button>

<button class="darkBtn" onclick="toggleTheme()">🌙</button>

</div>

</div>

</div>

<div class="card">

<button class="primary" onclick="addModule()">
+ Ajouter module
</button>

<button class="red" onclick="resetAll()">
Reset général
</button>

</div>

<div id="modules"></div>

<div class="card" id="exportArea">

<div class="exportHeader">

<h2>
PLAN D’IMPLANTATION PRATICABLES
</h2>

<h1 id="exportArtist">—</h1>

<p id="exportDate"></p>

</div>

<div id="resumeModules" class="moduleResume"></div>

<div id="planGlobal" class="planGlobal"></div>

<div class="legend">
<span style="color:#ff3b3b;font-weight:bold;">R</span>
→ Riser • Chiffre → Hauteur (cm)
</div>

<div class="commande">

<h2>COMMANDE MATÉRIEL</h2>

<div id="totaux" class="big"></div>

<div id="sucres" class="small"></div>

</div>

<div class="exportBtns">

<button class="green" onclick="exportPNG()">
Exporter la commande
</button>

<button class="primary" onclick="copyCommande()">
Copier la commande
</button>

<button class="orange" onclick="shareCommande()">
Envoyer la commande
</button>

</div>

</div>

<script>

let modules=[]

function save(){

localStorage.setItem(
"modules",
JSON.stringify(modules)
)

localStorage.setItem(
"artist",
artistInput.value
)

localStorage.setItem(
"date",
dateInput.value
)

localStorage.setItem(
"theme",
document.body.classList.contains("dark")
)

}

function load(){

modules=JSON.parse(
localStorage.getItem("modules") || "[]"
)

artistInput.value=
localStorage.getItem("artist") || ""

dateInput.value=
localStorage.getItem("date") || ""

if(localStorage.getItem("theme")==="true"){
document.body.classList.add("dark")
}

render()

}

function toggleTheme(){

document.body.classList.toggle("dark")

save()

}

function lockHeader(){

save()

render()

artistInput.blur()

dateInput.blur()

}

function unlockHeader(){

artistInput.focus()

}

function addModule(){

if(modules.some(m=>!m.validated)) return

modules.unshift({
A:"",
B:"",
H:"",
R:false,
validated:false
})

render()

}

function calc(m){

let cols=Math.ceil((m.A||0)/2)

let rows=Math.ceil((m.B||0))

let praticables=cols*rows

let risers=m.R
? praticables
: 0

let sucres=
((cols-1)*rows + cols*(rows-1))*2

return{
cols,
rows,
praticables,
risers,
sucres
}

}

function validateModule(i){

modules[i].validated=true

save()

render()

}

function removeModule(i){

modules.splice(i,1)

save()

render()

}

function update(i,key,val){

modules[i][key]=
key==="R"
? val
: val

render()

}

function render(){

artistDisplay.innerText=
artistInput.value || "—"

dateDisplay.innerText=
dateInput.value
? new Date(dateInput.value)
.toLocaleDateString("fr-FR")
: ""

exportArtist.innerText=
artistInput.value || "—"

exportDate.innerText=
dateInput.value
? new Date(dateInput.value)
.toLocaleDateString("fr-FR")
: ""

let html=""

let totalP=0
let totalR=0
let totalS=0

let validatedModules=[]

modules.forEach((m,i)=>{

let c=calc(m)

if(m.validated){

validatedModules.push(m)

totalP+=c.praticables
totalR+=c.risers
totalS+=c.sucres

}

html+=`

<div class="module">

${!m.validated ? `

<h3>Nouveau module</h3>

<div class="inputs">

<input
placeholder="Dimension A"
value="${m.A}"
onchange="update(${i},'A',this.value)"
>

<input
placeholder="Dimension B"
value="${m.B}"
onchange="update(${i},'B',this.value)"
>

<input
placeholder="Hauteur"
value="${m.H}"
onchange="update(${i},'H',this.value)"
>

<select onchange="update(${i},'R',this.value==='true')">

<option value="false" ${!m.R?"selected":""}>
Sans Riser
</option>

<option value="true" ${m.R?"selected":""}>
Sur Riser
</option>

</select>

</div>

<div
class="grid"
style="
grid-template-columns:
repeat(${Math.max(c.cols,1)},58px)
"
>

${Array(
Math.max(c.cols*c.rows,1)
).fill(0).map(()=>`

<div class="cell ${m.R?"riser":""}">

${m.H || ""}

${m.R
?'<div class="r">R</div>'
:""}

</div>

`).join("")}

</div>

<button
class="primary"
onclick="validateModule(${i})"
>

VALIDER MODULE

</button>

` : `

<h3>
${m.A} × ${m.B}
à ${m.H} cm
${m.R?"• R":""}
</h3>

<div>

Praticables : ${c.praticables}<br>

Risers : ${c.risers}<br>

<span class="small">
Sucres : ${c.sucres}
</span>

</div>

<div
class="grid"
style="
grid-template-columns:
repeat(${c.cols},58px)
"
>

${Array(c.cols*c.rows).fill(0).map(()=>`

<div class="cell ${m.R?"riser":""}">

${m.H}

${m.R
?'<div class="r">R</div>'
:""}

</div>

`).join("")}

</div>

<button
class="red"
onclick="removeModule(${i})"
>

Supprimer

</button>

`}

</div>

`

})

modulesContainer.innerHTML=html

resumeModules.innerHTML=`

<b>
${validatedModules.length}
module${validatedModules.length>1?"s":""} :
</b><br>

${validatedModules.map(m=>`

• ${m.A} × ${m.B}
à ${m.H}
${m.R?"R":""}

`).join("<br>")}

`

totaux.innerHTML=`

Modules : ${validatedModules.length}<br>

Praticables : ${totalP}<br>

Risers : ${totalR}

`

sucres.innerHTML=`
Sucres : ${totalS}
`

drawGlobalPlan()

save()

}

function drawGlobalPlan(){

planGlobal.innerHTML=""

modules.forEach(m=>{

if(!m.validated) return

let c=calc(m)

let totalCells=c.cols*c.rows

let scale=1

if(totalCells>12) scale=0.9
if(totalCells>20) scale=0.8
if(totalCells>30) scale=0.7

let block=document.createElement("div")

block.className="planBlock"

block.style.transform=`scale(${scale})`

let grid=document.createElement("div")

grid.className="grid"

grid.style.gridTemplateColumns=
`repeat(${c.cols},58px)`

for(let i=0;i<c.cols*c.rows;i++){

let cell=document.createElement("div")

cell.className=
`cell ${m.R?"riser":""}`

cell.innerText=m.H

if(m.R){

let r=document.createElement("div")

r.className="r"

r.innerText="R"

cell.appendChild(r)

}

grid.appendChild(cell)

}

block.appendChild(grid)

planGlobal.appendChild(block)

})

}

function exportPNG(){

html2canvas(
document.getElementById("exportArea")
).then(canvas=>{

let link=document.createElement("a")

link.download=
"plan-praticables.png"

link.href=canvas.toDataURL()

link.click()

})

}

function copyCommande(){

let txt=`

${artistInput.value}

${dateDisplay.innerText}

PLAN D’IMPLANTATION PRATICABLES

${resumeModules.innerText}

${totaux.innerText}

${sucres.innerText}

`

navigator.clipboard.writeText(txt)

alert("Commande copiée")

}

function shareCommande(){

let txt=`

${artistInput.value}

${dateDisplay.innerText}

PLAN D’IMPLANTATION PRATICABLES

${totaux.innerText}

`

if(navigator.share){

navigator.share({
title:"Plan praticables",
text:txt
})

}else{

alert("Partage non supporté")

}

}

function resetAll(){

let confirmReset=confirm(
"Êtes-vous sûr de vouloir tout effacer ?"
)

if(!confirmReset) return

modules=[]

artistInput.value=""
dateInput.value=""

localStorage.clear()

render()

}

document.addEventListener(
"DOMContentLoaded",
()=>{

window.modulesContainer=
document.getElementById("modules")

window.artistInput=
document.getElementById("artistInput")

window.dateInput=
document.getElementById("dateInput")

window.artistDisplay=
document.getElementById("artistDisplay")

window.dateDisplay=
document.getElementById("dateDisplay")

window.exportArtist=
document.getElementById("exportArtist")

window.exportDate=
document.getElementById("exportDate")

window.resumeModules=
document.getElementById("resumeModules")

window.totaux=
document.getElementById("totaux")

window.sucres=
document.getElementById("sucres")

window.planGlobal=
document.getElementById("planGlobal")

load()

})

</script>

</body>
</html>
