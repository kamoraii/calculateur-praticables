<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Praticables</title>

<link rel="icon" href="flavicon.jpg">
<link rel="apple-touch-icon" href="flavicon.jpg">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

:root{
--bg:#e9ecf2;
--card:#ffffff;
--text:#111;
--border:#cfd3da;
--accent:#6a5acd;
--green:#2e9d57;
--orange:#ff8c00;
}

.dark{
--bg:#121212;
--card:#1e1e1e;
--text:#fff;
--border:#333;
}

body{
margin:0;
font-family:-apple-system,Arial;
background:var(--bg);
color:var(--text);
padding:12px;
}

h1{
text-align:center;
margin:6px 0;
}

.headerInputs{
display:flex;
gap:6px;
margin-bottom:10px;
}

.headerInputs input{
flex:1;
padding:6px;
font-size:12px;
}

button{
padding:10px;
border:none;
border-radius:10px;
color:white;
width:100%;
margin-top:6px;
}

.card{
background:var(--card);
border:2px solid var(--border);
border-radius:12px;
padding:12px;
margin-bottom:12px;
}

.module{
border:2px solid var(--border);
border-radius:10px;
padding:10px;
margin-bottom:10px;
}

.grid{
display:grid;
gap:4px;
margin-top:6px;
}

.cell{
width:60px;
height:30px;
background:#e0e3ea;
display:flex;
align-items:center;
justify-content:center;
position:relative;
font-weight:bold;
}

.r{
position:absolute;
bottom:1px;
left:2px;
font-size:8px;
color:red;
font-weight:bold;
}

.globalPlan{
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:flex-start;
}

.commande{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.sucres{
font-size:12px;
opacity:0.5;
}

.legend{
font-size:12px;
opacity:0.7;
margin-top:8px;
}

.exportBtn{background:var(--green);}
.copyBtn{background:var(--accent);}
.shareBtn{background:var(--orange);}

</style>
</head>

<body>

<h1 id="title">—</h1>

<div class="headerInputs">
<input id="artiste" placeholder="Artiste">
<input id="date" type="date">
<button onclick="lockTitle()">✔</button>
<button onclick="unlockTitle()">✏️</button>
<button onclick="toggleTheme()">🌙</button>
</div>

<div class="card">
<button onclick="addModule()" id="addBtn">+ Ajouter module</button>
<button onclick="resetAll()" style="background:#d84343;">Reset</button>
</div>

<div id="modules"></div>

<div class="card" id="exportArea">

<div id="plan" class="globalPlan"></div>

<div class="legend">
R → Riser • chiffre = hauteur (cm)
</div>

<div id="total"></div>

<button class="exportBtn" onclick="exportPNG()">Exporter la commande</button>
<button class="copyBtn" onclick="copyText()">Copier la commande</button>
<button class="shareBtn" onclick="share()">Envoyer la commande</button>

</div>

<script>

let modules=[]
let locked=false

function save(){
localStorage.setItem("modules",JSON.stringify(modules))
localStorage.setItem("artiste",artiste.value)
localStorage.setItem("date",date.value)
localStorage.setItem("locked",locked)
localStorage.setItem("theme",document.body.classList.contains("dark"))
}

function load(){
modules=JSON.parse(localStorage.getItem("modules")||"[]")
artiste.value=localStorage.getItem("artiste")||""
date.value=localStorage.getItem("date")||""
locked=localStorage.getItem("locked")==="true"

if(localStorage.getItem("theme")==="true"){
document.body.classList.add("dark")
}

render()
}

function lockTitle(){locked=true;render();save()}
function unlockTitle(){locked=false;render();save()}
function toggleTheme(){document.body.classList.toggle("dark");save()}

function addModule(){
if(modules.some(m=>!m.validated)) return
modules.unshift({L:"",P:"",H:"",R:false,validated:false})
render()
}

function calc(m){
let L=Math.ceil((m.L||0)/2)
let P=Math.ceil((m.P||0))
let praticables=L*P
let risers=m.R?praticables:0
let sucres=((L-1)*P + L*(P-1))*2
return {L,P,praticables,risers,sucres}
}

function validateModule(i){modules[i].validated=true;save();render()}
function update(i,key,val){modules[i][key]=(key==="R")?val:val;render()}
function removeModule(i){modules.splice(i,1);save();render()}

function render(){

title.innerText = artiste.value
? `${artiste.value}\n${date.value?new Date(date.value).toLocaleDateString("fr-FR"):""}`
: "—"

let html=""
let totalP=0,totalR=0,totalS=0,count=0

modules.forEach((m,i)=>{

let c=calc(m)

if(m.validated){
totalP+=c.praticables
totalR+=c.risers
totalS+=c.sucres
count++
}

html+=`
<div class="module">

${!m.validated ? `

<input placeholder="Dimension A" value="${m.L}" onchange="update(${i},'L',this.value)">
<input placeholder="Dimension B" value="${m.P}" onchange="update(${i},'P',this.value)">
<input placeholder="Hauteur" value="${m.H}" onchange="update(${i},'H',this.value)">

<select onchange="update(${i},'R',this.value==='true')">
<option value="false" ${!m.R?"selected":""}>Sans Riser</option>
<option value="true" ${m.R?"selected":""}>Sur Riser</option>
</select>

<button onclick="validateModule(${i})">VALIDER</button>

` : `

<b>${m.L} × ${m.P} à ${m.H} cm</b><br>
Praticables : ${c.praticables}<br>
Risers : ${c.risers}<br>
<span class="sucres">Sucres : ${c.sucres}</span>

<div class="grid" style="grid-template-columns:repeat(${c.L},60px)">
${Array(c.L*c.P).fill(0).map(()=>`
<div class="cell">
${m.H}
${m.R?'<div class="r">R</div>':""}
</div>`).join("")}
</div>

<button onclick="removeModule(${i})">Supprimer</button>

`}

</div>`
})

modulesDiv.innerHTML=html

total.innerHTML=`
<div class="commande">
Modules : ${count}<br>
Praticables : ${totalP}<br>
Risers : ${totalR}
</div>
<div class="sucres">Sucres : ${totalS}</div>
`

drawPlan()
save()
}

function drawPlan(){

plan.innerHTML=""

modules.forEach(m=>{
if(!m.validated) return
let c=calc(m)

let wrap=document.createElement("div")
let grid=document.createElement("div")
grid.className="grid"
grid.style.gridTemplateColumns=`repeat(${c.L},60px)`

for(let i=0;i<c.L*c.P;i++){
let cell=document.createElement("div")
cell.className="cell"
cell.innerText=m.H

if(m.R){
let r=document.createElement("div")
r.className="r"
r.innerText="R"
cell.appendChild(r)
}

grid.appendChild(cell)
}

wrap.appendChild(grid)
plan.appendChild(wrap)
})
}

function exportPNG(){
html2canvas(document.getElementById("exportArea")).then(canvas=>{
let link=document.createElement("a")
link.download="plan.png"
link.href=canvas.toDataURL()
link.click()
})
}

function copyText(){
let text=`${artiste.value}
${date.value}

Modules : ${modules.filter(m=>m.validated).length}
Praticables : ${total.innerText}`
navigator.clipboard.writeText(text)
}

function share(){
let text=document.getElementById("total").innerText
if(navigator.share){
navigator.share({title:"Commande",text:text})
}else{
alert("Partage non supporté")
}
}

function resetAll(){
modules=[]
localStorage.clear()
render()
}

document.addEventListener("DOMContentLoaded",()=>{
modulesDiv=document.getElementById("modules")
plan=document.getElementById("plan")
total=document.getElementById("total")
artiste=document.getElementById("artiste")
date=document.getElementById("date")
title=document.getElementById("title")
load()
})

</script>

</body>
</html>
